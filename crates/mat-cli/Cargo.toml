[package]
name = "mat-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mat"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
cpal = "0.18.2"
hound = "3.5.1"
mat-core = { version = "0.1.0", path = "../mat-core" }
mat-lsp = { version = "0.1.0", path = "../mat-lsp" }
serde_json = "1.0.151"
